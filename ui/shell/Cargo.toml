[package]
name = "portalswitch-shell"
description = "Native window that hosts the PortalSwitch UI and bridges it to the local daemon API."
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Standalone, like the spikes: wry pulls MPL-2.0 crates that the product workspace's dependency
# policy rejects. See docs/decisions/ADR-0008 (not tracked) and deny.toml before moving it.
[workspace]

[dependencies]
include_dir = "0.7"
portal-config = { path = "../../crates/portal-config" }
portal-ipc = { path = "../../crates/portal-ipc" }
serde_json = "1"
tao = "0.34"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
wry = "0.54"

[profile.release]
lto = "thin"
