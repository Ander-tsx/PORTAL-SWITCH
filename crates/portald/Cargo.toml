[package]
name = "portald"
description = "PortalSwitch background daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "portald"

[[bin]]
name = "portald"
path = "src/main.rs"

[[bin]]
name = "portalctl"
path = "src/bin/portalctl.rs"

[dependencies]
portal-config.workspace = true
portal-core.workspace = true
portal-ipc.workspace = true
portal-net.workspace = true
portal-platform.workspace = true
portal-proto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[target.'cfg(target_os = "macos")'.dependencies]
portal-platform-macos.workspace = true

[lints]
workspace = true
