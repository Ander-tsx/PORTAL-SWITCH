[package]
name = "portal-net"
description = "PortalSwitch networking: machine identity, pinned trust, TLS, pairing and links."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
portal-core.workspace = true
portal-proto.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }

[lints]
workspace = true
