# Dependency policy, enforced in CI with `cargo deny check`.
# Only permissive licenses are allowed. Copyleft (GPL, LGPL, AGPL, MPL, EUPL, ...) is rejected.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Functionally equivalent to MIT (e.g. rustls-webpki).
    "ISC",
    # Unicode data files license (e.g. unicode-ident), permissive.
    "Unicode-3.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# Workspace crates declare Apache-2.0; private ones are still skipped by the check.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
