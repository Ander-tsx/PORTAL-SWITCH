[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
authors = ["The PortalSwitch Authors"]
repository = "https://github.com/Ander-tsx/PORTAL-SWITCH"

[workspace.dependencies]
portal-config = { path = "crates/portal-config" }
portal-core = { path = "crates/portal-core" }
portal-ipc = { path = "crates/portal-ipc" }
portal-proto = { path = "crates/portal-proto" }
portal-net = { path = "crates/portal-net" }
portal-platform = { path = "crates/portal-platform" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
