edition = "2024"
publish = false

# Standalone: spikes are not part of the product workspace.
[workspace]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_System_Services", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_System_Environment", "Win32_Graphics_Gdi"] }
